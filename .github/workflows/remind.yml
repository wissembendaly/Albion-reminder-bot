name: event-reminder

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check posts and send reminders
        run: python check.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          CHANNEL_IDS: ${{ vars.CHANNEL_IDS }}
          ROLES: ${{ vars.ROLES }}

      - name: Save state
        run: |
          git config user.name "reminder-bot"
          git config user.email "reminder-bot@users.noreply.github.com"
          git add reminded.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
